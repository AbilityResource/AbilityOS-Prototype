const cultureState={year:'2027',vision:'To be the most trusted provider of essential services in our markets.',mission:'Deliver reliable, accessible solutions through empowered people and disciplined execution.',theme:'Customer First. Execute Together.',values:'Accountability, Customer Focus, Integrity, Learning',purpose:'Improve lives through reliable service and responsible growth.',owner:'CEO / Strategy',effective:'2027-01-01',draftStatus:'Draft'};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function purposeStrip(){return `<section class="purpose-banner"><div><div class="eyebrow">OUR SHARED DIRECTION · ${esc(cultureState.year)} THEME</div><h2>${esc(cultureState.theme)}</h2><p>Mission: ${esc(cultureState.mission)}</p></div>${btn('Explore our purpose',`go('24')`,'')}</section>`}
function pullCulture(){for(const k of ['year','vision','mission','theme','values','purpose','effective']){const v=document.getElementById('c_'+k);if(v)cultureState[k]=v.value.trim()}cultureRenderPreview()}
function cultureRenderPreview(){const p=document.getElementById('culture_preview');if(p)p.innerHTML=`<small>${esc(cultureState.year)} · ANNUAL PERFORMANCE THEME</small><h2>${esc(cultureState.theme)||'Annual theme required'}</h2><p><b>VISION</b> — ${esc(cultureState.vision)||'Vision required'}<br><b>MISSION</b> — ${esc(cultureState.mission)||'Mission required'}</p><div class="culture-values">${cultureState.values.split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
 const valid=['year','vision','mission','theme','values','effective'].every(k=>cultureState[k].trim())&&/^\d{4}$/.test(cultureState.year);
 const b=document.getElementById('culturePublish');if(b)b.disabled=!valid;const m=document.getElementById('cultureValidation');if(m){m.textContent=valid?'Draft complete. Submit for approval; publication remains a separate authorised workflow.':'Complete vision, mission, values, valid year, theme and effective date before requesting approval.';m.className='policy-status '+(valid?'info':'bad')}
}

function cultureInput(label,key,type='text'){return `<div class="field"><label for="c_${key}">${label}</label><input id="c_${key}" type="${type}" value="${esc(cultureState[key])}" oninput="pullCulture()"/></div>`}
function cultureArea(label,key){return `<div class="field" style="margin-bottom:12px"><label for="c_${key}">${label}</label><textarea id="c_${key}" rows="2" oninput="pullCulture()">${esc(cultureState[key])}</textarea></div>`}
const scales={
 five:[{n:1,label:'Below standard',min:0,anchor:'Material gaps and agreed standards not met'},{n:2,label:'Partially meets',min:70,anchor:'Important gaps remain with improvement required'},{n:3,label:'Meets expectations',min:90,anchor:'Agreed outcomes substantially met with required quality'},{n:4,label:'Exceeds expectations',min:105,anchor:'Results exceed expectations with corroborated impact'},{n:5,label:'Exceptional',min:120,anchor:'Sustained, exceptional impact and verified evidence'}],
 four:[{n:1,label:'Below expectations',min:0,anchor:'Material missed standards'},{n:2,label:'Developing',min:80,anchor:'Partially achieved with demonstrable improvement'},{n:3,label:'Meets expectations',min:95,anchor:'Outcomes and standards met'},{n:4,label:'Exceeds expectations',min:115,anchor:'Consistently exceeds expectations'}],
 three:[{n:1,label:'Below expectations',min:0,anchor:'Improvement required'},{n:2,label:'Meets expectations',min:90,anchor:'Agreed results achieved'},{n:3,label:'Exceeds expectations',min:115,anchor:'Sustained additional impact'}]
};
const ratingState={mode:'five',version:'RATING-2027-01-v1',effective:'2027-01-01',sample:102,reviewFrequency:'Quarterly'};
function ratingBand(r,i,arr){const high=i+1<arr.length?`&lt; ${Number(arr[i+1].min).toFixed(0)}%`:'No upper limit';return `<tr><td><b>${r.n}</b></td><td><input class="labelinput" aria-label="Rating ${r.n} label" value="${esc(r.label)}" onchange="ratingEditLabel(${i},this.value)"/></td><td><input type="number" aria-label="Rating ${r.n} minimum" value="${r.min}" min="0" step="1" ${i===0?'readonly':''} oninput="ratingEditMin(${i},this.value)"/></td><td class="muted">${high}</td><td>${esc(r.anchor)}</td></tr>`}
function ratingEditLabel(i,v){if(scales[ratingState.mode])scales[ratingState.mode][i].label=v.trim();ratingValidate()}
function ratingEditMin(i,v){if(scales[ratingState.mode])scales[ratingState.mode][i].min=Number(v);ratingValidate()}
function ratingValidate(){const b=scales[ratingState.mode],status=document.getElementById('ratingValidation');if(!status)return;let ok=!b||b.every((x,i)=>Number.isFinite(x.min)&&x.min>=0&&(i===0?x.min===0:x.min>b[i-1].min)&&x.label.trim().length>0);
status.textContent=ok?'Draft policy bands valid; publication requires HR/authorised approval. Changes require new effective-dated versions.':'Invalid rating bands: each minimum must increase strictly, start at zero, and have a label.';
status.className='policy-status '+(ok?'info':'bad');const publish=document.getElementById('ratingPublish');if(publish)publish.disabled=!ok;
const preview=document.getElementById('ratingPreview');if(preview)preview.innerHTML=ratingExampleText(ok);
}
function ratingExampleText(valid=true){if(!valid)return '<b>Preview paused</b><br>Fix overlapping or invalid ranges first.';const mode=ratingState.mode,val=Number(ratingState.sample);if(mode==='none')return '<b>No overall numeric rating</b><br>Performance narrative and evidence remain mandatory.';if(mode==='narrative')return '<b>Narrative assessment</b><br>Role outcomes, contributions, context and development narrative; no forced number.';if(mode==='numeric')return `<b>${val.toFixed(0)} / 100</b><br>Numeric scale displayed as an example; normalisation/capping policy must be approved.`;
const arr=scales[mode];if(!arr)return '';const m=arr.slice().reverse().find(b=>val>=b.min);return `<b>${val}% → ${m.n} / ${arr.length}: ${esc(m.label)}</b><br>Illustrative standardised achievement index only; applicable evidence gates and calibration still apply.`}
function changeRatingMode(v){ratingState.mode=v;render();}
function ratingBandTable(){let arr=scales[ratingState.mode];if(!arr)return `<div class="snapshot"><b>${ratingState.mode==='none'?'No overall rating':'No categorical bands'}</b><div class="small muted" style="margin-top:5px">${ratingState.mode==='none'?'Evidence-based outcome summaries and development commitments still apply.':ratingState.mode==='numeric'?'Tenant-configured numeric output, precision, cap and audit rules apply.':'Structured narrative prompts replace overall numeric ratings.'}</div></div>`;return `<div style="overflow-x:auto"><table class="bandtable"><thead><tr><th>Band</th><th>Label (editable)</th><th>Minimum inclusive</th><th>Upper bound</th><th>Evidence anchor (example)</th></tr></thead><tbody>${arr.map((r,i)=>ratingBand(r,i,arr)).join('')}</tbody></table></div>`}
views['25']=()=>`${grid('g4',stat('Available modes','6','Five, four, three, numeric, narrative, none'),stat('Current policy','Draft v1','2027 policy, example'),stat('Review frequency',ratingState.reviewFrequency,'Set independently of 1:1 cadence'),stat('Forced bell curve','OFF','Diagnostic distribution only'))}<div style="height:15px"></div>
${grid('g-main',box('Rating scale & assessment rules',`<div class="horizontal">${badge('Tenant controlled','blue')}${badge('Effective-dated policy','green')}${badge('Draft — not published','amber')}</div><div class="divider"></div><div class="fields three"><div class="field"><label for="ratingMode">Overall rating approach</label><select id="ratingMode" onchange="changeRatingMode(this.value)">${[['five','5-point'],['four','4-point'],['three','3-point'],['numeric','Numeric'],['narrative','Narrative only'],['none','No overall rating']].map(a=>`<option value="${a[0]}" ${a[0]===ratingState.mode?'selected':''}>${a[1]}</option>`).join('')}</select></div>${field('Policy version',ratingState.version)}<div class="field"><label for="ratingEffective">Effective from</label><input id="ratingEffective" type="date" value="${ratingState.effective}" onchange="ratingState.effective=this.value"/></div></div><div class="divider"></div>${sectionTitle('Rating bands & evidence anchors','Sample bands — tenant must approve its own')} ${ratingBandTable()}
<div class="divider"></div><div class="fields three">${selectField('Score calculation rules',['Goal-specific normalisation + approved weights','Narrative only'],'Goal-specific normalisation + approved weights')}${selectField('Rounding',['2 decimals','Whole percentage','1 decimal'],'2 decimals')}${selectField('Moderation',['Independent self / manager / calibrator','Manager + HR','Manager only'],'Independent self / manager / calibrator')}</div><div class="notice" style="margin-top:13px"><b>Scoring semantics:</b> Every goal carries a metric direction (higher/lower/target-range/milestone), verified evidence and a policy version. Overall rating uses only approved committed measures and other approved criteria. Aspirational OKR stretch outcomes are not automatically tied to pay.</div>
<div class="horizontal" style="margin-top:14px">${btn('Review as manager',`go('10')`,'quiet')}<button class="btn primary" id="ratingPublish" onclick="toast('Demo only: route draft to HR and authorised approver; no policy was published')">Request rating policy approval</button></div><div id="ratingValidation" class="policy-status info" style="margin-top:12px">Draft bands valid. Required: HR and authorised approval.</div>`,badge('Policy editor','blue')),
box('Live interpretation & fairness',`${sectionTitle('What will the appraiser see?')}<div class="fields"><div class="field"><label for="scoreSample">Illustrative achievement index (%)</label><input type="number" id="scoreSample" min="0" max="300" value="${ratingState.sample}" oninput="ratingState.sample=Number(this.value);ratingValidate()"/></div>${selectField('Source',['Verified committed KPI evidence','Observed behaviours + evidence','Combined approved assessment'],'Verified committed KPI evidence')}</div><div id="ratingPreview" class="snapshot" style="margin-top:12px;background:#e8f5ef;line-height:1.65">${ratingExampleText()}</div><div class="divider"></div>${sectionTitle('Anchors, not arbitrary labels')}<div class="anchor-card"><b>1. Evidence first</b><p>Source freshness, accepted output and counter-evidence visible before rating.</p></div><div class="anchor-card"><b>2. Independent judgments</b><p>Self-rating, manager rating and calibration are stored separately with rationale.</p></div><div class="anchor-card"><b>3. Fair comparison</b><p>Target difficulty, job role, working conditions, quality and ethics matter.</p></div><div class="anchor-card"><b>4. Transparent employee view</b><p>Show rating definition, score rules, explanation and a disagreement route.</p></div><div class="anchor-card"><b>5. Governance</b><p>Changes create a new policy version; history cannot be silently re-rated.</p></div><div class="divider"></div>${btn('Bell curve diagnostics',`go('12')`,'quiet')} ${btn('Policy audit',`go('20')`,'quiet')}`))}<div style="height:15px"></div>
${box('Where this policy applies',`${table(['Screen / step','Required developer behaviour','Automatic consequence?'],[['Goal setting','Keep goal direction, metric unit, KPI weights, thresholds and effective policy ID','No'],['Self / manager review','Display the same published rating anchors; collect independent assessments','No'],['Calibration','Preserve prior ratings; record adjustments and reasons','No'],['Bell-curve diagnostics','Show observed distribution; suppress small groups; no quota-based rating edits','No'],['PIP and PDP','PIP requires case-specific HR fairness approval; PDP may apply at any rating','No automatic PIP'],['Rewards','Use separate eligibility/quality/budget policy and approvals','No automatic payment']])}<div class="alert" style="margin-top:12px">The illustrative bands on this screen are NOT a binding company grading policy. Existing V4 reference examples contain differences; the tenant must approve exactly one version before the first live cycle.</div>`)}${demoNotice()}`;

// Demonstration-only calculation gates; production requires server-side validation of the same policy.
function updateGoalWeights(){let nums=[...document.querySelectorAll('.weight-input')].map(e=>Number(e.value||0));let s=nums.reduce((a,b)=>a+b,0);let ok=Math.abs(s-100)<.00001&&nums.every(n=>n>=0&&n<=100);document.getElementById('goalWeightSum').textContent='Total active weight: '+s.toFixed(2)+'%';document.getElementById('goalWeightMessage').textContent=ok?'Ready for manager submission':'Cannot approve: active goal weights must equal 100.00%';document.getElementById('goalWeightMessage').style.color=ok?'#1d8768':'#be4654';document.getElementById('goalSubmit').disabled=!ok;}
function updateCascade(){let s=[...document.querySelectorAll('.cascade-input')].reduce((a,x)=>a+Number(x.value||0),0);let r=24000000-s;let ok=Math.abs(r)<.01;document.getElementById('cascadeCheck').textContent=ok?'Allocation reconciled · 100.0%':'Allocation mismatch · '+(s/24000000*100).toFixed(1)+'%';document.getElementById('cascadeCheck').style.color=ok?'#1d8768':'#be4654';document.getElementById('cascadeHint').textContent=ok?'Children + retained = parent target':'Unallocated / overallocated KES '+r.toLocaleString('en-KE')+' — request approval or rebalance';document.getElementById('cascadeBtn').disabled=!ok;}
